<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="flex justify-center bg-gray-100">

  <div class="w-full max-w-sm p-4 pb-24">

    <button onclick="history.back()" class="flex items-center gap-2 mb-4 text-blue-700">
      <i data-lucide="arrow-left"></i> <span>Back</span>
    </button>

    <h1 class="text-2xl font-bold mb-4">CHAT</h1>

    <div id="chatWindow"
      class="bg-white p-4 rounded-2xl shadow min-h-[350px] mb-4 flex flex-col gap-3 overflow-y-auto">
    </div>

    <div class="bg-white p-3 rounded-2xl shadow flex items-center gap-2">
      <input id="replyInput" type="text"
        placeholder="Type a message..."
        class="flex-1 border border-gray-300 rounded-xl p-2" />

      <button onclick="sendMessage()"
        class="bg-blue-700 text-white px-4 py-2 rounded-xl font-semibold">
        Send
      </button>
    </div>

  </div>

  <!-- NAV -->
  <nav class="w-full fixed bottom-0 bg-white shadow flex justify-around py-3">
    <a href="home.html"><i data-lucide="home" class="w-7 h-7 text-gray-400"></i></a>
    <a href="messages.html"><i data-lucide="message-square" class="w-7 h-7 text-blue-600"></i></a>
    <a href="alerts.html"><i data-lucide="alert-circle" class="w-7 h-7 text-gray-400"></i></a>
    <a href="settings.html"><i data-lucide="settings" class="w-7 h-7 text-gray-400"></i></a>
  </nav>


  <script>
    // Same IDs and threads as messages.html
    const chatThreads = {
      1: [{ sender: "them", text: "Shift reminder: You start at 9AM tomorrow." }],
      2: [{ sender: "them", text: "Weather alert: heavy rain expected." }],
      3: [{ sender: "them", text: "You have a new task assigned." }],
      4: [{ sender: "them", text: "Please confirm the recent update." }],
      5: [{ sender: "them", text: "Your information has been updated." }]
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    // Safety — fallback to message 1 if ID missing
    const thread = chatThreads[id] || chatThreads[1];

    const chatWin = document.getElementById("chatWindow");

    function renderChat() {
      chatWin.innerHTML = "";
      thread.forEach(msg => {
        const bubble = document.createElement("div");
        bubble.className =
          "max-w-[75%] px-3 py-2 rounded-xl text-sm shadow " +
          (msg.sender === "me"
            ? "self-end bg-blue-700 text-white"
            : "self-start bg-gray-200 text-black");
        bubble.innerText = msg.text;
        chatWin.appendChild(bubble);
      });
    }

    function sendMessage() {
      const input = document.getElementById("replyInput");
      const text = input.value.trim();
      if (!text) return;

      thread.push({ sender: "me", text });
      input.value = "";
      renderChat();
      chatWin.scrollTop = chatWin.scrollHeight;
    }

    renderChat();
    lucide.createIcons();
  </script>
</body>
</html>
