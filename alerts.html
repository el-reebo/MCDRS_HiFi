<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alerts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex justify-center bg-gray-100">

  <div class="w-full max-w-sm p-4 pb-20">
    <h1 class="text-2xl font-bold mb-3">ALERTS</h1>
    <div class="w-full h-1 bg-gray-300 mb-4"></div>

    <div class="bg-blue-700 p-4 rounded-2xl">
      <div class="bg-white flex items-center gap-3 p-3 rounded-xl mb-3">
        <i data-lucide="alert-circle" class="text-red-500"></i>
        <p class="text-sm font-semibold">HIGH PRIORITY<br />LOCATION DESCRIPTION</p>
      </div>
      <div class="bg-white flex items-center gap-3 p-3 rounded-xl mb-3">
        <i data-lucide="alert-circle" class="text-yellow-500"></i>
        <p class="text-sm font-semibold">MEDIUM PRIORITY<br />LOCATION DESCRIPTION</p>
      </div>
      <div class="bg-white flex items-center gap-3 p-3 rounded-xl">
        <i data-lucide="alert-circle" class="text-green-600"></i>
        <p class="text-sm font-semibold">LOW PRIORITY<br />LOCATION DESCRIPTION</p>
      </div>
    </div>
  </div>

  <nav class="w-full fixed bottom-0 bg-white shadow flex justify-around py-3">
    <a href="home.html"><i data-lucide="home" class="w-7 h-7 text-gray-400"></i></a>
    <a href="messages.html"><i data-lucide="message-square" class="w-7 h-7 text-gray-400"></i></a>
    <a href="alerts.html"><i data-lucide="alert-circle" class="w-7 h-7 text-blue-600"></i></a>
    <a href="settings.html"><i data-lucide="settings" class="w-7 h-7 text-gray-400"></i></a>
  </nav>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
