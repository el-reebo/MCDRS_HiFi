<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="flex justify-center bg-gray-100">

  <div class="w-full max-w-sm p-4 pb-24">
    <h1 class="text-2xl font-bold mb-4">MESSAGES</h1>

    <div id="messageList" class="bg-gray-200 p-4 rounded-2xl flex flex-col gap-3"></div>
  </div>

  <!-- NAV -->
  <nav class="w-full fixed bottom-0 bg-white shadow flex justify-around py-3">
    <a href="home.html"><i data-lucide="home" class="w-7 h-7 text-gray-400"></i></a>

    <a href="messages.html" class="relative">
      <i data-lucide="message-square" class="w-7 h-7 text-blue-600"></i>
      <span id="unreadBadge"
        class="hidden absolute -top-1 -right-2 bg-blue-600 text-white text-xs px-1.5 py-0.5 rounded-full font-bold"></span>
    </a>

    <a href="alerts.html"><i data-lucide="alert-circle" class="w-7 h-7 text-gray-400"></i></a>
    <a href="settings.html"><i data-lucide="settings" class="w-7 h-7 text-gray-400"></i></a>
  </nav>


  <script>
    // Demo Messages — unread resets every refresh
    const messages = [
      { id: 1, text: "Hello! This is your first system message.", unread: true },
      { id: 2, text: "Reminder: Your next shift starts tomorrow.", unread: true },
      { id: 3, text: "Weather alert: Conditions may change suddenly.", unread: false },
      { id: 4, text: "Your supervisor updated your schedule.", unread: false },
      { id: 5, text: "System Notice: Your profile has been updated.", unread: false }
    ];

    const list = document.getElementById("messageList");
    const badge = document.getElementById("unreadBadge");

    function updateBadge() {
      const unreadCount = messages.filter(m => m.unread).length;
      if (unreadCount > 0) {
        badge.classList.remove("hidden");
        badge.textContent = unreadCount;
      } else {
        badge.classList.add("hidden");
      }
    }

    function renderMessages() {
      list.innerHTML = "";

      messages.forEach(msg => {
        const item = document.createElement("a");
        item.href = `chat.html?id=${msg.id}`;
        item.className =
          "bg-white flex items-center gap-3 p-3 rounded-xl shadow cursor-pointer transition";

        // If unread → blue bar + bold text
        if (msg.unread) {
          item.innerHTML = `
            <div class="w-1.5 bg-blue-600 rounded-full h-full"></div>
            <i data-lucide="user" class="w-6 h-6"></i>
            <p class="font-bold text-sm">${msg.text.slice(0, 25)}...</p>
          `;
        } else {
          item.innerHTML = `
            <i data-lucide="user" class="w-6 h-6"></i>
            <p class="text-sm text-gray-700">${msg.text.slice(0, 25)}...</p>
          `;
        }

        list.appendChild(item);
      });

      lucide.createIcons();
      updateBadge();
    }

    renderMessages();
  </script>

</body>
</html>
